    <!-- Anti-flash inline script: immediately apply theme before render -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('econverse_theme_mode_v2');
          const isDark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches) || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          // fallback
        }
      })();
    </script>
